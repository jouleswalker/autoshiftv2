apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Renders the shared components/operator-install chart, which owns the OperatorPolicy structure and
# creates the namespace (with the cluster-monitoring label). The per-operator ACM lookups below are the
# visible, greppable inputs — every autoshift.io/web-terminal-* label this operator consumes is here.
# ${REMEDIATION} is substituted by the CMP before kustomize runs.
helmGlobals:
  chartHome: ../../../../../components/
helmCharts:
  - name: operator-install
    releaseName: web-terminal
    valuesInline:
      name: web-terminal
      namespace: openshift-operators
      remediation: ${REMEDIATION}
      policyNamespace: ${POLICY_NAMESPACE}
      subscription:
        name: '{{hub index .ManagedClusterLabels "autoshift.io/web-terminal-subscription-name" | default "web-terminal" hub}}'
        channel: '{{hub index .ManagedClusterLabels "autoshift.io/web-terminal-channel" | default "fast" hub}}'
        source: '{{hub $base := (index .ManagedClusterLabels "autoshift.io/web-terminal-source" | default "redhat-operators") hub}}{{hub ternary (printf "%s-%s" $base (index .ManagedClusterLabels "autoshift.io/mirror-catalog-suffix" | default "mirror")) $base (eq (index .ManagedClusterLabels "autoshift.io/disconnected-mirror" | default "false") "true") hub}}'
        sourceNamespace: '{{hub index .ManagedClusterLabels "autoshift.io/web-terminal-source-namespace" | default "openshift-marketplace" hub}}'
        # Version resolution (config lives in the rendered-config ConfigMap on the hub):
        #   config mode (config.web-terminal.versions set): versions = that list; startingCSV = config.web-terminal.startingCSV
        #     (explicit — the list says what's ALLOWED, not where to START; default "" = let OLM pick).
        #   label mode (no config): versions = [web-terminal-version label]; startingCSV = that same version.
        # $vers is computed here and reused by `versions` below.
        startingCSV: |-
          {{hub- $cfg := (index (index (index ((lookup "v1" "ConfigMap" "${POLICY_NAMESPACE}" (printf "%s.rendered-config" .ManagedClusterName)) | default dict) "data" | default dict) "config" | default "" | fromYaml | default dict) "web-terminal" | default dict) hub}}
          {{hub- $cfgVers := (dig "versions" (list) $cfg) hub}}
          {{hub- $isCfg := (not (empty $cfgVers)) hub}}
          {{hub- $labelVer := (index .ManagedClusterLabels "autoshift.io/web-terminal-version" | default "") hub}}
          {{hub- $vers := (ternary $cfgVers (ternary (list) (list $labelVer) (empty $labelVer)) $isCfg) hub}}
          {{hub- (ternary (dig "startingCSV" "" $cfg) $labelVer $isCfg) hub}}
      # versions reuses $vers set in startingCSV above (same policy, resolves after it).
      versions: '{{hub $vers | toRawJson | toLiteral hub}}'
