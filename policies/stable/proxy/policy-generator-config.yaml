apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: proxy
# Multiple policies share one placement, so the binding must be named.
placementBindingDefaults:
  name: binding-policy-proxy
# Day-2 OpenShift proxy can be configured during install and enforced as a day 2 operation
#
# Design note: the inform checks decide Compliant/NonCompliant in Go template logic and force
# NonCompliant with a mustnothave on the ClusterVersion (an object that always exists) — ACM does not
# reliably match status lists (conditions/history/availableUpdates), so those are never asserted.
# Failure visibility for an in-flight upgrade comes from OpenShift's own upgrade alerts, not a
# (flappy) policy check.
policyDefaults:
  namespace: ${POLICY_NAMESPACE}
  remediationAction: ${REMEDIATION}
  severity: high
  consolidateManifests: true
  evaluationInterval:
    compliant: ${EVAL_COMPLIANT}
    noncompliant: ${EVAL_NONCOMPLIANT}
  standards:
    - NIST SP 800-53
  categories:
    - CM Configuration Management
  controls:
    - CM-2 Baseline Configuration
  placement:
    placementPath: placement.yaml
policies:
  # 1. Proxy (enforce, unconditional) — cluster proxy will be configured with specified httpProxy,
  #    httpsProxy, noProxy variables, and a trustedCA config map
  - name: policy-proxy
    remediationAction: inform
    dependencies:
      - name: check-proxy-trusted-ca
        compliance: Compliant
    manifests:
      - path: manifests/proxy.yaml

  # 4. Completion status (inform) — Compliant if the cluster has the specified CA configmap.
  - name: policy-check-proxy-trusted-ca
    remediationAction: inform
    manifests:
      - path: test/check-proxy-trusted-ca.yaml
    customMessage:
      noncompliant: >
        Cluster does not have required trustedCA config map. 
        proxy cannot be applied until CA with correct name is applied to cluster.
